[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "careerpilot"
version = "0.1.0"
description = "CareerPilot MVP — Assistente local-first em pt-BR para busca de vagas, currículo fiel à origem, aprovação explícita e preenchimento assistido."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0,<2.0",
    "beautifulsoup4>=4.12.3,<5.0",
    "cryptography>=43.0.0,<47.0",
    "fastapi>=0.115.0,<1.0",
    "httpx>=0.27.2,<1.0",
    "jinja2>=3.1.4,<4.0",
    "playwright>=1.49.0,<2.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",
    "pypdf>=5.1.0,<6.0",
    "python-docx>=1.1.2,<2.0",
    "python-multipart>=0.0.17,<1.0",
    "reportlab>=4.2.5,<5.0",
    "sqlalchemy>=2.0.35,<3.0",
    "uvicorn[standard]>=0.32.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0,<2.0",
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "ruff>=0.8.0,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
plugins = []
